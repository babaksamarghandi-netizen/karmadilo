workflows:
  android-debug:
    name: Karmadilo Android APK
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: flutter create . --platforms android --project-name karmadilo
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
